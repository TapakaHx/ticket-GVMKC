<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Адмін-панель | GreenSupport</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Адмін-панель</p>
          <h1>Керування чергою заявок</h1>
        </div>
        <div class="admin-actions">
          <button id="sound-toggle" class="secondary">Увімкнути звук</button>
          <a class="secondary" href="/">На головну</a>
        </div>
      </header>

      <section class="admin-grid">
        <div class="admin-list">
          <h2>Активні заявки</h2>
          <div id="ticket-list" class="ticket-list"></div>
        </div>
        <div class="admin-editor">
          <h2>Редагування</h2>
          <form id="edit-form" class="ticket-form">
            <input type="hidden" name="id" />
            <label>
              Повне імʼя
              <input name="fullName" type="text" required />
            </label>
            <label>
              Службовий номер
              <input name="serviceNumber" type="text" required />
            </label>
            <label>
              Категорія
              <select name="category" required>
                <option>ARM</option>
                <option>Printer</option>
                <option>WiFi</option>
                <option>Medical devices</option>
                <option>Phone</option>
              </select>
            </label>
            <label>
              Опис
              <textarea name="description" rows="4" required></textarea>
            </label>
            <label>
              Статус
              <select name="status" required>
                <option value="queue">queue</option>
                <option value="in progress">in progress</option>
                <option value="done">done</option>
              </select>
            </label>
            <div class="done-fields" id="done-fields" hidden>
              <label>
                Виконавець
                <select name="executor">
                  <option value="" disabled selected>Оберіть виконавця</option>
                  <option>Олена Коваль</option>
                  <option>Михайло Руденко</option>
                  <option>Ірина Бойко</option>
                  <option>Дмитро Савчук</option>
                </select>
              </label>
              <label>
                Дата завершення
                <input name="completionDate" type="date" />
              </label>
            </div>
            <button type="submit" class="primary">Зберегти</button>
          </form>
        </div>
      </section>
    </div>

    <div id="password-overlay" class="password-overlay">
      <div class="password-card">
        <h2>Доступ до адмін-панелі</h2>
        <p>Введіть пароль для перегляду заявок.</p>
        <form id="password-form">
          <input type="password" name="password" placeholder="Пароль" required />
          <button type="submit" class="primary">Підтвердити</button>
        </form>
        <p id="password-error" class="password-error" hidden>Невірний пароль.</p>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
